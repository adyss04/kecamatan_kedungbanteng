<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <title>Peta Kecamatan Kedungbanteng</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>

    <!-- ================= HEADER ================= -->
    <div class="header-wrapper">
        <header class="navbar navbar-style-2">
            <div class="logo-container logo-style-2">
                <img src="logo-bms.png" alt="Logo Kecamatan" class="logo">

                <div class="nama-wrapper">
                    <span class="nama-kecamatan">KECAMATAN KEDUNGBANTENG</span>
                    <span class="nama-kabupaten">Kabupaten Banyumas</span>
                </div>
            </div>

            <nav class="nav-links nav-style-2">
                <a href="index.html" class="active">Beranda</a>
                <a href="peta-kecamatan.html">Peta Kecamatan</a>
                <a href="peta-desa.html">Peta Desa</a>
                <a href="tentang.html">Tentang</a>
            </nav>
        </header>
    </div>

    <main class="content-container">
        <section class="content-section">
            <h2>Peta Kecamatan Kedungbanteng</h2>
            <div class="map-container">
                <iframe src="./kecamatann/index.html" class="map-iframe"></iframe>
            </div>
        </section>
    </main>

    <footer>
        <p>&copy; 2025 Kecamatan Kedungbanteng</p>
    </footer>
    <script>
        document.addEventListener("DOMContentLoaded", function () {
            const currentPath = window.location.pathname.split("/").pop() || "index.html";
            const navLinks = document.querySelectorAll(".nav-style-2 a");

            navLinks.forEach(link => {
                const linkPath = link.getAttribute("href");

                if (linkPath === currentPath) {
                    link.classList.add("active");
                } else {
                    link.classList.remove("active");
                }
            });
        });
    </script>

</body>

</html>
